<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --nacht:#0E1C24;
  --nacht-tief:#081217;
  --gold:#C8A44D;
  --gold-hell:#EBD79A;
  --elfenbein:#F4EFE4;
  --dunst:#8497A0;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--nacht-tief);
  color:var(--elfenbein);
  font-family:Didot,"Bodoni MT",Garamond,Baskerville,"Palatino Linotype",Georgia,serif;
  font-size:20px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* Sternenfeld und Lichtschein */
.himmel{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, #17323F 0%, #0E1C24 45%, #081217 100%);
}
.himmel svg{position:absolute; inset:0; width:100%; height:100%}

#app{position:relative; z-index:1; min-height:100%}

/* Rahmen wie auf einer Einladungskarte */
.blatt{
  max-width:46rem; margin:0 auto;
  padding:clamp(2rem,6vw,4.5rem) clamp(1.4rem,5vw,3rem) 4rem;
  min-height:100vh; display:flex; flex-direction:column; justify-content:center;
}
.karte{
  border:1px solid rgba(200,164,77,.34);
  padding:clamp(1.8rem,5vw,3.4rem);
  position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0));
}
.karte::before,.karte::after{
  content:""; position:absolute; width:11px; height:11px;
  border:1px solid var(--gold); opacity:.8;
}
.karte::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.karte::after{bottom:-1px; right:-1px; border-left:0; border-top:0}

h1{font-size:clamp(2.4rem,8vw,4rem); line-height:1.05; font-weight:normal; margin:0 0 .7rem; letter-spacing:.01em}
h2{font-size:clamp(1.5rem,4.4vw,2.15rem); line-height:1.25; font-weight:normal; margin:0 0 .5rem; max-width:24ch}
p{margin:0 0 1rem; max-width:60ch}
.leise{color:var(--dunst); font-size:.9rem; line-height:1.6}

/* Fortschritt als feine Linie */
.fortschritt{height:1px; background:rgba(200,164,77,.2); margin-bottom:2.4rem; position:relative}
.fortschritt i{position:absolute; left:0; top:0; height:1px; background:var(--gold); transition:width .45s ease}

/* Antwortzeilen */
.wahl{
  display:flex; align-items:center; gap:1.2rem; width:100%;
  text-align:left; color:inherit; font:inherit; cursor:pointer;
  background:transparent; border:0; border-bottom:1px solid rgba(244,239,228,.14);
  padding:1.15rem .4rem; position:relative;
  transition:background-color .18s, padding-left .18s;
}
.wahl:first-of-type{border-top:1px solid rgba(244,239,228,.14)}
.wahl:hover,.wahl:focus-visible{background:rgba(200,164,77,.07); padding-left:1rem}
.wahl:focus-visible{outline:1px solid var(--gold); outline-offset:-1px}
.wahl.an{background:rgba(200,164,77,.13); padding-left:1rem}
.wahl.an::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--gold)}
.wahl .titel{display:block; font-size:1.15rem; line-height:1.35}
.wahl .unter{display:block; color:var(--dunst); font-size:.86rem; margin-top:.15rem}
.wahl .vignette{flex:0 0 auto; width:80px; height:58px}
.wahl .glyph{flex:0 0 auto; width:32px; height:32px}
.marke{
  flex:0 0 auto; margin-left:auto; width:16px; height:16px;
  border:1px solid rgba(200,164,77,.5); border-radius:50%;
}
.wahl.an .marke{background:var(--gold); border-color:var(--gold)}

/* Knöpfe */
.knopf{
  font:inherit; cursor:pointer; letter-spacing:.06em;
  padding:.72rem 1.9rem; border-radius:0;
  background:var(--gold); color:var(--nacht-tief); border:1px solid var(--gold);
  transition:background-color .18s, color .18s;
}
.knopf:hover{background:var(--gold-hell); border-color:var(--gold-hell)}
.knopf:disabled{opacity:.28; cursor:default}
.knopf.leiseknopf{background:transparent; color:var(--gold); border-color:rgba(200,164,77,.5)}
.knopf.leiseknopf:hover{background:rgba(200,164,77,.12); color:var(--gold-hell)}
.knopf:focus-visible{outline:1px solid var(--elfenbein); outline-offset:3px}
.fussleiste{display:flex; gap:.8rem; align-items:center; margin-top:2rem; flex-wrap:wrap}

textarea{
  width:100%; min-height:7.5rem; font:inherit; color:var(--elfenbein);
  background:rgba(255,255,255,.04); border:1px solid rgba(200,164,77,.3);
  padding:1rem 1.1rem; resize:vertical;
}
textarea::placeholder{color:rgba(132,151,160,.75)}
textarea:focus-visible{outline:1px solid var(--gold); outline-offset:1px}

/* Auftakt */
.auftakt{text-align:center}
.auftakt p{margin-left:auto; margin-right:auto}
.auftakt .fussleiste{justify-content:center}
.zahl{
  font-size:clamp(6rem,20vw,10.5rem); line-height:.86; margin:0;
  background:linear-gradient(160deg,#8E6E26 0%,#EBD79A 38%,#C8A44D 62%,#F6E9BE 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.zierlinie{display:flex; align-items:center; gap:1rem; justify-content:center; margin:1.5rem 0 1.8rem}
.zierlinie span{height:1px; width:min(120px,22vw); background:linear-gradient(90deg,transparent,var(--gold))}
.zierlinie span+span{background:linear-gradient(90deg,var(--gold),transparent)}
.zierlinie svg{flex:0 0 auto}
.eigenfoto{
  display:block; width:min(300px,64vw); height:auto; margin:0 auto 2rem;
  border:1px solid rgba(200,164,77,.45); padding:7px;
}

/* Einwurf */
.einwurf h2{color:var(--gold-hell)}

/* Warten */
.warten{text-align:center}
@keyframes atmen{0%,100%{opacity:.25; transform:scaleX(.35)}50%{opacity:1; transform:scaleX(1)}}
.atem{height:1px; width:min(320px,70vw); margin:0 auto 2rem; background:var(--gold); animation:atmen 2.2s ease-in-out infinite}

/* Ergebnis */
.enthuellung h2{font-size:clamp(1.7rem,5vw,2.5rem); color:var(--gold-hell); margin-bottom:1.2rem}
.zeilen{margin:2rem 0; border-top:1px solid rgba(200,164,77,.28)}
.zeile{
  display:flex; gap:1.2rem; align-items:baseline; justify-content:space-between;
  padding:.85rem .2rem; border-bottom:1px solid rgba(244,239,228,.12);
}
.zeile dt{color:var(--dunst); font-size:.84rem; letter-spacing:.05em; flex:0 0 auto}
.zeile dd{margin:0; text-align:right; font-size:1.1rem; color:var(--elfenbein)}
@keyframes auftauchen{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
.zeile{animation:auftauchen .5s backwards}

.wunschzeile{margin:1.6rem 0; font-style:italic; color:var(--gold-hell)}
.siegel{display:block; margin:2.4rem auto 1.4rem}
.zusage{border-top:1px solid rgba(200,164,77,.28); padding-top:1.4rem}
.zusage ul{margin:.6rem 0 0; padding-left:1.1rem; color:var(--elfenbein)}
.zusage li{margin-bottom:.35rem}

/* Bildkacheln für die Zielwahl */
.kachel{
  display:block; width:100%; position:relative; overflow:hidden;
  margin:0 0 1.1rem; padding:0; cursor:pointer; text-align:left;
  color:inherit; font:inherit; background:transparent;
  border:1px solid rgba(200,164,77,.32);
}
.kachel .foto,.kachel .platzhalter{
  display:block; width:100%; height:clamp(150px,27vw,215px); object-fit:cover;
  filter:saturate(.82) brightness(.72); transition:transform .6s ease, filter .35s ease;
}
.kachel .platzhalter{
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.035); filter:none;
}
.kachel .platzhalter .vignette{width:132px; height:auto}
.kachel:hover .foto,.kachel:focus-visible .foto{transform:scale(1.04); filter:saturate(1) brightness(.88)}
.kachel:focus-visible{outline:1px solid var(--gold); outline-offset:2px}
.kachel.an{border-color:var(--gold); border-width:2px}
.kachel.an .foto{filter:saturate(1) brightness(.9)}
.beschriftung{
  position:absolute; left:0; right:0; bottom:0; padding:1.1rem 1.3rem;
  background:linear-gradient(0deg, rgba(8,18,23,.94) 0%, rgba(8,18,23,.55) 55%, transparent 100%);
}
.beschriftung .titel{display:block; font-size:1.3rem; line-height:1.25}
.beschriftung .unter{display:block; color:#B9C6CC; font-size:.85rem; margin-top:.1rem}

/* Vollbild hinter dem Auftakt */
.vollbild{
  position:fixed; inset:0; z-index:0;
  background-size:cover; background-position:center;
}
.vollbild::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(8,18,23,.72), rgba(8,18,23,.86));
}
.vollbild+.blatt .karte{background:rgba(8,18,23,.45); backdrop-filter:blur(2px)}

/* Fotoband im Ergebnis */
.endebild{
  display:block; width:100%; height:clamp(160px,30vw,250px); object-fit:cover;
  margin:0 0 2rem; filter:saturate(.9) brightness(.82);
}

@media (max-width:540px){
  body{font-size:18px}
  .wahl{gap:.9rem; padding:1rem .3rem}
  .wahl .vignette{width:58px; height:44px}
  .zeile{flex-direction:column; gap:.1rem}
  .zeile dd{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}

@media print{
  .himmel,.fussleiste,.fortschritt{display:none !important}
  body{background:#fff; color:#1A1208}
  .blatt{min-height:0; padding:0; display:block; max-width:none}
  .karte{border:1px solid #A8873C; padding:2rem; background:none}
  .enthuellung h2,.wunschzeile{color:#8A6A1E}
  .zeile{animation:none; border-bottom:1px solid #D8CDB2}
  .zeile dt{color:#6B5A38}
  .zeile dd{color:#1A1208}
  .zeilen,.zusage{border-top:1px solid #A8873C}
  .siegel{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>

    {id:"winterwandern", titel:"Durch den Schnee wandern", bild:GLYPHEN.fjordwandern}
  ]},

{ id:"tun_sachs", art:"mehrfach", wenn:function(a){return a.ziel==="sachsen";},
  frage:"Und was würdest du dort machen?",
  hinweis:"Mehreres geht.",
  optionen:[
    {id:"ranger",        titel:"Eine Tour mit einem echten Ranger", bild:GLYPHEN.ranger},
    {id:"wildtiere",     titel:"Wildtiere beobachten", bild:GLYPHEN.wildtiere},
    {id:"sonnenaufgang", titel:"Sonnenaufgang im Wald", unter:"Heißt: sehr früh raus", bild:GLYPHEN.sonnenaufgang},
    {id:"klettersteig",  titel:"Einen Klettersteig gehen", bild:GLYPHEN.klettern}
  ]},

{ id:"tun_alpen", art:"mehrfach", wenn:function(a){return a.ziel==="alpen";},
  frage:"Und was würdest du dort machen?",
  hinweis:"Mehreres geht.",
  optionen:[
    {id:"huettentour", titel:"Hüttentour mit Übernachtung", bild:GLYPHEN.huette},
    {id:"gipfel",      titel:"Einen richtigen Gipfel mitnehmen", bild:GLYPHEN.gipfel},
    {id:"bergsee",     titel:"An einen Bergsee", bild:GLYPHEN.bergsee}
  ]},

{ id:"wer", art:"frage",
  frage:"Wen würdest du mitnehmen?",
  optionen:[
    {id:"zweit", titel:"Nur Anett und dich", bild:GLYPHEN.paar},
    {id:"jungs", titel:"Euch zwei und zwei, drei von den Jungs", bild:GLYPHEN.runde}
  ]},

{ id:"schlafen_skan", art:"frage", wenn:function(a){return a.ziel==="skandinavien";},
  frage:"Wo würdet ihr schlafen?",
  optionen:[
    {id:"hytten",    titel:"Eigenes Auto, feste Hütten unterwegs", bild:GLYPHEN.auto},
    {id:"imauto",    titel:"Eigenes Auto, und geschlafen wird drin", bild:GLYPHEN.autoschlaf},
    {id:"wohnmobil", titel:"Wohnmobil", unter:"Ab Deutschland gemietet", bild:GLYPHEN.wohnmobil}
  ]},

{ id:"schlafen_sachs", art:"frage", wenn:function(a){return a.ziel==="sachsen";},
  frage:"Wo würdet ihr schlafen?",
  optionen:[
    {id:"pension",   titel:"Pension", unter:"Abends ein richtiges Bett", bild:GLYPHEN.pension},
    {id:"imauto",    titel:"Im eigenen Auto", bild:GLYPHEN.autoschlaf},
    {id:"wohnmobil", titel:"Wohnmobil", bild:GLYPHEN.wohnmobil}
  ]},

{ id:"dauer_sachs", art:"frage", wenn:function(a){return a.ziel==="sachsen";},
  frage:"Wie lange würdest du wegbleiben?",
  optionen:[
    {id:"kurz",  titel:"Kurz und knackig", unter:"Ein langes Wochenende", bild:GLYPHEN.kurz},
    {id:"woche", titel:"Eine richtige Woche", bild:GLYPHEN.woche}
  ]},

{ id:"dauer_lang", art:"frage", wenn:function(a){return a.ziel==="skandinavien" || a.ziel==="alpen";},
  frage:"Wie lange würdest du wegbleiben?",
  optionen:[
    {id:"woche", titel:"Eine Woche", bild:GLYPHEN.woche},
    {id:"lang",  titel:"Einmal richtig lang", unter:"Wenn Anett es freibekommt", bild:GLYPHEN.lang}
  ]},

{ id:"einwurf_skan", art:"einwurf",
  wenn:function(a){return a.ziel==="skandinavien" && a.dauer_lang==="woche";},
  frage:"Kurz nachgerechnet.",
  text:"Von hier bis Norwegen sind es rund 1.800 Kilometer pro Richtung. Bei einer Woche säßet ihr vier Tage davon im Auto. Ginge, dann würde es Südnorwegen oder Schweden. Der Polarkreis, die Lofoten und die Wale liegen aber deutlich weiter oben.",
  optionen:[
    {id:"sueden",  titel:"Passt, dann eben der Süden"},
    {id:"laenger", titel:"Dann lieber länger und richtig genießen"}
  ]},

{ id:"tempo", art:"frage",
  frage:"Welches Tempo?",
  optionen:[
    {id:"viel",    titel:"Viel sehen", unter:"Fast jeden Tag woanders", bild:GLYPHEN.viel},
    {id:"bleiben", titel:"Ankommen und bleiben", unter:"Ein, zwei Standorte, mehr nicht", bild:GLYPHEN.bleiben}
  ]},

{ id:"wunsch", art:"text",
  frage:"Müsste etwas unbedingt dabei sein?",
  hinweis:"Schreib es einfach hin, auch wenn es albern klingt.",
  platzhalter:"Eine Strecke, ein Ort, eine alte Idee, die nie was wurde …" },

{ id:"warten", art:"warten" },
{ id:"ende",   art:"ende" }
];

/* ---------------------- Zustand ---------------------- */
var antworten = {}, verlauf = [], jetzt = 0;

function sichtbar(i){ var s=SCHIRME[i]; return !s.wenn || s.wenn(antworten); }
function naechster(von){
  for(var i=von+1;i<SCHIRME.length;i++){ if(sichtbar(i)) return i; }
  return SCHIRME.length-1;
}
function weiter(){ verlauf.push(jetzt); jetzt=naechster(jetzt); zeichne(); }
function zurueck(){ if(!verlauf.length) return; jetzt=verlauf.pop(); zeichne(); }
function spaetereLoeschen(i){
  for(var k=i+1;k<SCHIRME.length;k++){ delete antworten[SCHIRME[k].id]; }
}
function setze(id,wert){ spaetereLoeschen(jetzt); antworten[id]=wert; }

function fortschrittHtml(){
  var gesamt=0, davor=0;
  for(var i=0;i<SCHIRME.length;i++){
    var s=SCHIRME[i];
    if(s.art==="auftakt"||s.art==="warten"||s.art==="ende") continue;
    if(!sichtbar(i)) continue;
    gesamt++; if(i<jetzt) davor++;
  }
  if(!gesamt) return "";
  var breite = Math.round(davor/gesamt*100);
  return '<div class="fortschritt"><i style="width:'+breite+'%"></i></div>';
}

/* ---------------------- Zeichnen ---------------------- */
var app = document.getElementById("app");

function zeichne(){
  var s = SCHIRME[jetzt], innen;
  if(s.art==="auftakt")      innen = auftaktHtml();
  else if(s.art==="warten")  innen = wartenHtml();
  else if(s.art==="ende")    innen = endeHtml();
  else if(s.art==="text")     innen = fortschrittHtml()+textHtml(s);
  else if(s.art==="einwurf")  innen = fortschrittHtml()+einwurfHtml(s);
  else if(s.art==="bildwahl") innen = fortschrittHtml()+bildwahlHtml(s);
  else                        innen = fortschrittHtml()+frageHtml(s);

  var hintergrund = (s.art==="auftakt" && BILDER.auftakt)
    ? '<div class="vollbild" style="background-image:url(\''+BILDER.auftakt+'\')"></div>' : '';
  app.innerHTML = hintergrund+'<div class="blatt"><div class="karte">'+innen+'</div></div>';
  window.scrollTo(0,0);
  verdrahte(s);
  if(s.art==="warten") setTimeout(function(){
    if(SCHIRME[jetzt].art==="warten"){ jetzt=naechster(jetzt); zeichne(); }
  }, 3000);
}

function bildwahlHtml(s){
  var h = '<h2>'+s.frage+'</h2>';
  if(s.hinweis) h += '<p class="leise">'+s.hinweis+'</p>';
  h += '<div style="margin-top:1.8rem">';
  for(var i=0;i<s.optionen.length;i++){
    var o = s.optionen[i];
    var an = antworten[s.id]===o.id ? " an" : "";
    var quelle = BILDER[o.id];
    var inhalt = quelle
      ? '<img class="foto" src="'+quelle+'" alt="">'
      : '<div class="platzhalter">'+(o.bild||"")+'</div>';
    h += '<button class="kachel'+an+'" data-wahl="'+o.id+'">'+inhalt
       + '<span class="beschriftung"><span class="titel">'+o.titel+'</span>'
       + (o.unter?'<span class="unter">'+o.unter+'</span>':'')
       + '</span></button>';
  }
  return h + '</div>' + fussHtml(false);
}

function auftaktHtml(){
  return '<div class="auftakt">'
    +'<p class="zahl">65</p>'
    +'<div class="zierlinie"><span></span>'
    +'<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0l1.8 5.2L14 7l-5.2 1.8L7 14l-1.8-5.2L0 7l5.2-1.8z" fill="#C8A44D"/></svg>'
    +'<span></span></div>'
    +'<h1>Für dich.</h1>'
    +'<p>Ein paar Fragen. Alle rein hypothetisch, also überleg nicht lange und antworte einfach, wie dir zumute ist.</p>'
    +'<p class="leise">Warum, das erfährst du am Ende.</p>'
    +'<div class="fussleiste"><button class="knopf" data-los>Anfangen</button></div></div>';
}

function frageHtml(s){
  var viele = s.art==="mehrfach";
  var gewaehlt = viele ? (antworten[s.id]||[]) : null;
  var h = '<h2>'+s.frage+'</h2>';
  if(s.hinweis) h += '<p class="leise">'+s.hinweis+'</p>';
  h += '<div style="margin-top:1.8rem">';
  for(var i=0;i<s.optionen.length;i++){
    var o=s.optionen[i];
    var an = viele ? (gewaehlt.indexOf(o.id)>-1?" an":"") : (antworten[s.id]===o.id?" an":"");
    h += '<button class="wahl'+an+'" data-wahl="'+o.id+'">'
       + (o.bild||"")
       + '<span><span class="titel">'+o.titel+'</span>'
       + (o.unter?'<span class="unter">'+o.unter+'</span>':'')
       + '</span>'
       + (viele?'<span class="marke"></span>':'')
       + '</button>';
  }
  h += '</div>' + fussHtml(viele);
  return h;
}

function einwurfHtml(s){
  var h = '<div class="einwurf"><h2>'+s.frage+'</h2><p>'+s.text+'</p></div><div style="margin-top:1.8rem">';
  for(var i=0;i<s.optionen.length;i++){
    h += '<button class="wahl" data-wahl="'+s.optionen[i].id+'"><span><span class="titel">'
       + s.optionen[i].titel+'</span></span></button>';
  }
  return h + '</div>' + fussHtml(false);
}

function textHtml(s){
  return '<h2>'+s.frage+'</h2><p class="leise">'+s.hinweis+'</p>'
    + '<textarea id="wunschfeld" placeholder="'+s.platzhalter+'">'+(antworten[s.id]||"")+'</textarea>'
    + fussHtml(true);
}

function fussHtml(mitWeiter){
  var h='<div class="fussleiste">';
  if(verlauf.length) h += '<button class="knopf leiseknopf" data-zurueck>Zurück</button>';
  if(mitWeiter)      h += '<button class="knopf" data-weiter>Weiter</button>';
  return h+'</div>';
}

function wartenHtml(){
  return '<div class="warten"><div class="atem"></div><h2 style="margin:0 auto">Einen Moment noch.</h2></div>';
}

/* ---------------------- Das Ende ---------------------- */
function beschriftung(schirmId, wertId){
  for(var i=0;i<SCHIRME.length;i++){
    var s=SCHIRME[i];
    if(s.id!==schirmId || !s.optionen) continue;
    for(var k=0;k<s.optionen.length;k++){ if(s.optionen[k].id===wertId) return s.optionen[k].titel; }
  }
  return wertId;
}

function zeilenListe(){
  var a=antworten, liste=[];
  var ziel = beschriftung("ziel", a.ziel);
  if(a.ziel==="skandinavien" && a.einwurf_skan==="sueden") ziel = "Südnorwegen und Schweden";
  liste.push(["Ziel", ziel]);

  var zeit = a.zeit_skan||a.zeit_sachs||a.zeit_alpen;
  if(zeit) liste.push(["Jahreszeit", beschriftung(
    a.ziel==="skandinavien"?"zeit_skan":a.ziel==="sachsen"?"zeit_sachs":"zeit_alpen", zeit)]);

  var tunId = a.ziel==="sachsen" ? "tun_sachs"
            : a.ziel==="alpen"   ? "tun_alpen"
            : (a.zeit_skan==="winter" ? "tun_skan_winter" : "tun_skan_sommer");
  var tun = a[tunId]||[], namen=[];
  for(var i=0;i<tun.length;i++) namen.push(beschriftung(tunId, tun[i]));
  if(namen.length) liste.push(["Dabei", namen.join(" · ")]);

  if(a.wer) liste.push(["Mit", beschriftung("wer", a.wer)]);
  var schlafId = a.ziel==="skandinavien" ? "schlafen_skan" : "schlafen_sachs";
  if(a[schlafId]) liste.push(["Übernachtung", beschriftung(schlafId, a[schlafId])]);
  if(a.ziel==="alpen") liste.push(["Übernachtung", "Auf den Hütten"]);

  var dauer = a.dauer_sachs ? beschriftung("dauer_sachs", a.dauer_sachs)
            : a.dauer_lang  ? beschriftung("dauer_lang", a.dauer_lang) : null;
  if(a.einwurf_skan==="laenger") dauer = "Einmal richtig lang";
  if(dauer) liste.push(["Dauer", dauer]);
  if(a.tempo) liste.push(["Tempo", beschriftung("tempo", a.tempo)]);
  return liste;
}

function endeHtml(){
  var liste = zeilenListe(), zeilen="";
  for(var i=0;i<liste.length;i++){
    zeilen += '<div class="zeile" style="animation-delay:'+(0.5+i*0.16)+'s">'
      +'<dt>'+liste[i][0]+'</dt><dd>'+liste[i][1]+'</dd></div>';
  }
  var wunsch = antworten.wunsch
    ? '<p class="wunschzeile">Und das, was unbedingt dabei sein sollte: '+entschaerfen(antworten.wunsch)+'</p>' : '';
  var jungs = antworten.wer==="jungs"
    ? '<li>Für die Jungs organisieren wir gern mit, ihre Buchung zahlen sie selbst</li>' : '';

  var siegel = '<svg class="siegel" width="86" height="86" viewBox="0 0 86 86" fill="none">'
    +'<circle cx="43" cy="43" r="40" stroke="#C8A44D" stroke-width="1"/>'
    +'<circle cx="43" cy="43" r="34" stroke="#C8A44D" stroke-width="1" opacity=".45"/>'
    +'<path d="M43 24l4.6 13.2L61 41.8l-13.4 4.6L43 60l-4.6-13.6L25 41.8l13.4-4.6z" fill="#C8A44D" opacity=".9"/>'
    +'</svg>';

  var zielbild = BILDER[antworten.ziel]
    ? '<img class="endebild" src="'+BILDER[antworten.ziel]+'" alt="">' : '';

  return '<div class="enthuellung">'+zielbild
    +'<h2>Es war keine hypothetische Frage.</h2>'
    +'<p>Das hier ist dein Geschenk. Du hast es dir gerade selbst ausgesucht, ohne es zu wissen.</p>'
    +'<div class="zeilen">'+zeilen+'</div>'
    + wunsch
    + siegel
    +'<div class="zusage"><strong>Was wir übernehmen</strong><ul>'
    +'<li>Ein Fahrzeug, falls eins gemietet wird</li>'
    +'<li>Alle Übernachtungen</li>'
    +'<li>Die gebuchten Touren</li>'
    + jungs
    +'</ul><p class="leise" style="margin-top:.9rem">Sprit und Essen bleiben deine Sache. Gebucht wird, sobald Anett weiß, wann sie frei bekommt. Alles Weitere klären wir am Küchentisch.</p></div>'
    +'</div>'
    +'<div class="fussleiste"><button class="knopf" data-drucken>Ausdrucken</button>'
    +'<button class="knopf leiseknopf" data-kopieren>Antworten kopieren</button>'
    +'<button class="knopf leiseknopf" data-neu>Von vorn</button></div>';
}

function entschaerfen(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function alsText(){
  var liste=zeilenListe(), zeilen=["Zum 65."];
  for(var i=0;i<liste.length;i++) zeilen.push(liste[i][0]+": "+liste[i][1]);
  if(antworten.wunsch) zeilen.push("Unbedingt dabei: "+antworten.wunsch);
  return zeilen.join("\n");
}

/* ---------------------- Bedienung ---------------------- */
function verdrahte(s){
  var los = app.querySelector("[data-los]");
  if(los) los.onclick = weiter;
  var zur = app.querySelector("[data-zurueck]");
  if(zur) zur.onclick = zurueck;

  if(s.art==="frage" || s.art==="einwurf" || s.art==="bildwahl"){
    var kn = app.querySelectorAll("[data-wahl]");
    for(var i=0;i<kn.length;i++){
      kn[i].onclick = function(){
        setze(s.id, this.getAttribute("data-wahl"));
        if(s.id==="einwurf_skan" && antworten.einwurf_skan==="laenger") antworten.dauer_lang="lang";
        weiter();
      };
    }
  }

  if(s.art==="mehrfach"){
    var gewaehlt = antworten[s.id] ? antworten[s.id].slice() : [];
    var kn2 = app.querySelectorAll("[data-wahl]");
    var w = app.querySelector("[data-weiter]");
    for(var k=0;k<kn2.length;k++){
      kn2[k].onclick = function(){
        var id=this.getAttribute("data-wahl"), pos=gewaehlt.indexOf(id);
        if(pos>-1) gewaehlt.splice(pos,1); else gewaehlt.push(id);
        this.classList.toggle("an", pos===-1);
        if(w) w.disabled = gewaehlt.length===0;
      };
    }
    if(w){
      w.disabled = gewaehlt.length===0;
      w.onclick = function(){ setze(s.id, gewaehlt); weiter(); };
    }
  }

  if(s.art==="text"){
    var feld = app.querySelector("#wunschfeld");
    var wt = app.querySelector("[data-weiter]");
    if(wt) wt.onclick = function(){ setze(s.id, feld.value.trim()); weiter(); };
  }

  var d = app.querySelector("[data-drucken]");
  if(d) d.onclick = function(){ window.print(); };

  var kop = app.querySelector("[data-kopieren]");
  if(kop) kop.onclick = function(){
    var self=this, txt=alsText();
    function fertig(){ self.textContent="Kopiert"; setTimeout(function(){ self.textContent="Antworten kopieren"; },1800); }
    function ersatz(){
      var t=document.createElement("textarea");
      t.value=txt; document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); fertig(); }catch(e){ self.textContent="Ging nicht"; }
      document.body.removeChild(t);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(fertig, ersatz);
    } else { ersatz(); }
  };

  var neu = app.querySelector("[data-neu]");
  if(neu) neu.onclick = function(){ antworten={}; verlauf=[]; jetzt=0; zeichne(); };
}

zeichne();
</script>
