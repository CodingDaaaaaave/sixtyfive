<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>65</title>

<style>
:root{
  --nacht:#0E1C24; --nacht-tief:#081217;
  --gold:#C8A44D; --gold-hell:#EBD79A;
  --elfenbein:#F4EFE4; --dunst:#8497A0;
}
*{box-sizing:border-box}
html{font-size:20px}
html.gross{font-size:31px}
html,body{height:100%}
body{
  margin:0; background:var(--nacht-tief); color:var(--elfenbein);
  font-family:Didot,"Bodoni MT",Garamond,Baskerville,"Palatino Linotype",Georgia,serif;
  font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.himmel{position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(120% 80% at 50% -10%, #17323F 0%, #0E1C24 45%, #081217 100%)}
.himmel svg{position:absolute; inset:0; width:100%; height:100%}
#app{position:relative; z-index:1; min-height:100%}

/* Schalter, bewusst unauffällig */
.schalter{position:fixed; right:.6rem; top:.5rem; z-index:60; display:flex; gap:.35rem}
.schalter button{
  font-family:system-ui,sans-serif; font-size:11px; letter-spacing:.05em;
  background:transparent; color:rgba(132,151,160,.4); border:1px solid rgba(132,151,160,.22);
  border-radius:99px; padding:3px 10px; cursor:pointer;
}
.schalter button:hover{color:var(--gold); border-color:rgba(200,164,77,.5)}

.blatt{max-width:46rem; margin:0 auto; padding:2.4rem 1.6rem 3rem;
  min-height:100vh; display:flex; flex-direction:column; justify-content:center}
.karte{border:1px solid rgba(200,164,77,.34); padding:2rem; position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0))}
.karte::before,.karte::after{content:""; position:absolute; width:11px; height:11px;
  border:1px solid var(--gold); opacity:.8}
.karte::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.karte::after{bottom:-1px; right:-1px; border-left:0; border-top:0}

h1{font-size:2.4rem; line-height:1.05; font-weight:normal; margin:0 0 .7rem}
h2{font-size:1.5rem; line-height:1.3; font-weight:normal; margin:0 0 .5rem; max-width:24ch}
p{margin:0 0 1rem; max-width:58ch}
.leise{color:#A9B8C0; font-size:.82rem; line-height:1.55}

.fortschritt{height:1px; background:rgba(200,164,77,.2); margin-bottom:2rem; position:relative}
.fortschritt i{position:absolute; left:0; top:0; height:1px; background:var(--gold); transition:width .45s ease}

.wahl{display:flex; align-items:center; gap:1rem; width:100%;
  text-align:left; color:inherit; font:inherit; cursor:pointer; background:transparent;
  border:0; border-bottom:1px solid rgba(244,239,228,.14);
  padding:1rem .3rem; position:relative; transition:background-color .18s, padding-left .18s}
.wahl:first-of-type{border-top:1px solid rgba(244,239,228,.14)}
.wahl:hover,.wahl:focus-visible{background:rgba(200,164,77,.07); padding-left:.9rem}
.wahl:focus-visible{outline:1px solid var(--gold); outline-offset:-1px}
.wahl.an{background:rgba(200,164,77,.13); padding-left:.9rem}
.wahl.an::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--gold)}
.nummer{flex:0 0 auto; width:1.7rem; height:1.7rem; border:1px solid rgba(200,164,77,.45);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:.78rem; color:var(--gold); line-height:1}
.wahl.an .nummer{background:var(--gold); color:var(--nacht-tief); border-color:var(--gold)}
.wahl .glyph{flex:0 0 auto; width:1.6rem; height:1.6rem}
.wahl .titel{display:block; font-size:1.05rem; line-height:1.35}
.wahl .unter{display:block; color:#A9B8C0; font-size:.8rem; margin-top:.1rem}
.marke{flex:0 0 auto; margin-left:auto; width:.8rem; height:.8rem;
  border:1px solid rgba(200,164,77,.5); border-radius:50%}
.wahl.an .marke{background:var(--gold); border-color:var(--gold)}

.bahn{display:block; position:relative; width:100%; overflow:hidden; cursor:pointer;
  margin:0 0 .6rem; padding:0; text-align:left; color:inherit; font:inherit;
  background:#0A161C; border:1px solid rgba(200,164,77,.22)}
.bahn .foto,.bahn .platzhalter{display:block; width:100%; height:9rem; object-fit:cover;
  filter:saturate(.8) brightness(.62); transition:transform .7s ease, filter .35s ease}
.bahn .platzhalter{display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.03); filter:none}
.bahn .platzhalter svg{width:7rem; height:auto}
.bahn:hover .foto{transform:scale(1.05); filter:saturate(1) brightness(.8)}
.bahn:focus-visible{outline:1px solid var(--gold); outline-offset:2px}
.bahn.an{border-color:var(--gold); border-width:2px}
.bahn.an .foto{filter:saturate(1) brightness(.82)}
.aufdruck{position:absolute; inset:0; display:flex; align-items:center; gap:1rem;
  padding:0 1.3rem; z-index:2;
  background:linear-gradient(90deg, rgba(8,18,23,.92) 0%, rgba(8,18,23,.55) 55%, rgba(8,18,23,.1) 100%)}
.aufdruck .gross{display:block; font-size:1.35rem; line-height:1.25}
.aufdruck .klein{display:block; color:#B9C6CC; font-size:.82rem; margin-top:.12rem}

.knopf{font:inherit; cursor:pointer; letter-spacing:.05em; padding:.65rem 1.7rem;
  background:var(--gold); color:var(--nacht-tief); border:1px solid var(--gold)}
.knopf:hover{background:var(--gold-hell); border-color:var(--gold-hell)}
.knopf:disabled{opacity:.28; cursor:default}
.knopf.leiseknopf{background:transparent; color:var(--gold); border-color:rgba(200,164,77,.5)}
.knopf.leiseknopf:hover{background:rgba(200,164,77,.12); color:var(--gold-hell)}
.knopf:focus-visible{outline:1px solid var(--elfenbein); outline-offset:3px}
.fussleiste{display:flex; gap:.7rem; align-items:center; margin-top:1.8rem; flex-wrap:wrap}

textarea{width:100%; min-height:6rem; font:inherit; color:var(--elfenbein);
  background:rgba(255,255,255,.04); border:1px solid rgba(200,164,77,.3);
  padding:.9rem 1rem; resize:vertical}
textarea::placeholder{color:rgba(132,151,160,.7)}
textarea:focus-visible{outline:1px solid var(--gold); outline-offset:1px}

.auftakt{text-align:center}
.auftakt p{margin-left:auto; margin-right:auto}
.auftakt .fussleiste{justify-content:center}
.zahl{font-size:7rem; line-height:.86; margin:0;
  background:linear-gradient(160deg,#8E6E26 0%,#EBD79A 38%,#C8A44D 62%,#F6E9BE 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.zierlinie{display:flex; align-items:center; gap:.9rem; justify-content:center; margin:1.3rem 0 1.6rem}
.zierlinie span{height:1px; width:5rem; background:linear-gradient(90deg,transparent,var(--gold))}
.zierlinie span+span{background:linear-gradient(90deg,var(--gold),transparent)}
.startbild{display:block; width:min(30rem,94%); height:auto; margin:0 auto 1.6rem;
  border:1px solid rgba(200,164,77,.45); filter:saturate(.9) brightness(.92)}
.auftakt .zahl{font-size:4.6rem}
html.gross .startbild{width:min(22rem,82%)}

.einwurf h2{color:var(--gold-hell)}
.warten{text-align:center}
@keyframes atmen{0%,100%{opacity:.25; transform:scaleX(.35)}50%{opacity:1; transform:scaleX(1)}}
.atem{height:1px; width:14rem; margin:0 auto 1.8rem; background:var(--gold); animation:atmen 2.2s ease-in-out infinite}

/* Reisetyp vor der Aufloesung */
.typ{text-align:center}
.typ .art{font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dunst); margin:0 0 1rem}
.typ h2{font-size:2.4rem; color:var(--gold-hell); margin:0 auto .9rem; max-width:none}
.typ p{margin-left:auto; margin-right:auto}
.typ .fussleiste{justify-content:center}

/* Der Bruch, ganz allein auf dem Schirm */
.bruch{text-align:center; padding:2rem 0}
.bruch h2{font-size:2.6rem; color:var(--gold-hell); margin:0 auto 1.2rem; max-width:none; line-height:1.15}
.bruch p{margin-left:auto; margin-right:auto; max-width:34ch}
.bruch .fussleiste{justify-content:center}
@keyframes langsam{from{opacity:0}to{opacity:1}}
.bruch h2{animation:langsam 1.1s backwards .2s}
.bruch p{animation:langsam 1.1s backwards 1s}
.bruch .fussleiste{animation:langsam 1.1s backwards 1.9s}

.endebild{display:block; width:100%; height:9rem; object-fit:cover; margin:0 0 1.6rem;
  filter:saturate(.9) brightness(.8)}
.zeilen{margin:1.4rem 0 0; border-top:1px solid rgba(200,164,77,.28)}
.zeile{display:flex; gap:1.1rem; align-items:baseline; justify-content:space-between;
  padding:.75rem .2rem; border-bottom:1px solid rgba(244,239,228,.12)}
.zeile dt{color:#A9B8C0; font-size:.78rem; letter-spacing:.04em; flex:0 0 auto}
.zeile dd{margin:0; text-align:right; font-size:1.02rem}
@keyframes auftauchen{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
.zeile{animation:auftauchen .5s backwards}
.rueckgriff{margin:1.4rem 0 0; color:var(--gold-hell); font-style:italic}
.wunschzeile{margin:.6rem 0 0; font-style:italic; color:var(--gold-hell)}

/* Kleingedrucktes: nur auf dem Ausdruck */
.nurdruck{display:none}

html.gross .blatt{max-width:52rem; padding:1.6rem 1.4rem 2rem}
html.gross .karte{padding:1.6rem}
html.gross .leise{color:#C3D0D6; font-size:.86rem}
html.gross .wahl{padding:1.15rem .3rem}
html.gross .bahn .foto,html.gross .bahn .platzhalter{height:7.5rem}
html.gross .zahl{font-size:6rem}

@media (max-width:560px){
  html{font-size:17px}
  .wahl{gap:.7rem} .aufdruck{padding:0 1rem}
  .zeile{flex-direction:column; gap:.05rem} .zeile dd{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
@media print{
  .himmel,.fussleiste,.fortschritt,.schalter{display:none !important}
  body{background:#fff; color:#1A1208}
  .blatt{min-height:0; padding:0; display:block; max-width:none}
  .karte{border:1px solid #A8873C; padding:2rem; background:none}
  .wunschzeile,.rueckgriff{color:#8A6A1E}
  .zeile{animation:none; border-bottom:1px solid #D8CDB2}
  .zeile dt{color:#6B5A38} .zeile dd{color:#1A1208}
  .zeilen{border-top:1px solid #A8873C}
  .nurdruck{display:block; border-top:1px solid #A8873C; padding-top:1.2rem; margin-top:1.8rem}
  .nurdruck ul{margin:.5rem 0 0; padding-left:1.1rem}
  .nurdruck li{margin-bottom:.3rem}
  .nurdruck .leise{color:#6B5A38}
}
</style>

    <circle cx="330" cy="160" r="1.3" opacity=".5"/><circle cx="470" cy="60" r="0.9" opacity=".35"/>
    <circle cx="610" cy="140" r="1.1" opacity=".5"/><circle cx="760" cy="90" r="0.8" opacity=".4"/>
    <circle cx="850" cy="220" r="1.2" opacity=".45"/><circle cx="140" cy="300" r="0.9" opacity=".35"/>
    <circle cx="700" cy="330" r="1" opacity=".4"/><circle cx="410" cy="270" r="0.8" opacity=".3"/>
    <circle cx="560" cy="420" r="1.1" opacity=".3"/><circle cx="250" cy="470" r="0.9" opacity=".28"/>
  </g></svg>
</div>

<div class="schalter">
  <button id="beamer">Beamer</button>
</div>
<div id="app"></div>

/* Reisetyp. Kommt vor der Aufloesung, damit der Test etwas liefert.
   Reihenfolge zaehlt, der erste Treffer gilt. */
function reisetyp(){
  var a = antworten;
  var tun = a.tun_skan_sommer||a.tun_skan_winter||a.tun_sachs||a.tun_alpen||[];
  function hat(x){ return tun.indexOf(x)>-1; }
  var lang = a.dauer_lang==="lang" || a.einwurf_skan==="laenger";

  if(a.ziel==="skandinavien" && lang)
    return ["Der Weitfahrer","Für dich fängt die Reise nicht am Ziel an, sondern an der Haustür. Je weiter, desto besser, und Umwege gehören dazu."];
  if(hat("sonne") || hat("wildtiere"))
    return ["Der Frühaufsteher","Du bist draußen, wenn andere noch schlafen. Das Beste passiert zwischen fünf und acht."];
  if(hat("gipfel") || hat("huetten") || hat("klettern"))
    return ["Der Gipfelgeher","Ein Weg ist erst fertig, wenn er oben endet. Und oben sitzt man dann und sagt nichts."];
  if(a.tempo==="bleiben")
    return ["Der Ankommer","Du musst nicht alles sehen. Ein guter Platz, ein paar Tage, und du weißt, wo der beste Kaffee ist."];
  return ["Der Entdecker","Stillsitzen ist nichts für dich. Lieber jeden Tag was Neues, auch wenn abends die Füße wehtun."];
}

/* ---------------------- Zustand ---------------------- */
var antworten = {}, verlauf = [], jetzt = 0;
function sichtbar(i){ var s=SCHIRME[i]; return !s.wenn || s.wenn(antworten); }
function naechster(von){
  for(var i=von+1;i<SCHIRME.length;i++) if(sichtbar(i)) return i;
  return SCHIRME.length-1;
}
function weiter(){ verlauf.push(jetzt); jetzt=naechster(jetzt); zeichne(); }
function zurueck(){ if(!verlauf.length) return; jetzt=verlauf.pop(); zeichne(); }
function spaetereLoeschen(i){ for(var k=i+1;k<SCHIRME.length;k++) delete antworten[SCHIRME[k].id]; }
function setze(id,wert){ spaetereLoeschen(jetzt); antworten[id]=wert; }

function fortschrittHtml(){
  var gesamt=0, davor=0;
  for(var i=0;i<SCHIRME.length;i++){
    var s=SCHIRME[i];
    if(s.art==="auftakt"||s.art==="warten"||s.art==="typ"||s.art==="bruch"||s.art==="ende"||!sichtbar(i)) continue;
    gesamt++; if(i<jetzt) davor++;
  }
  if(!gesamt) return "";
  return '<div class="fortschritt"><i style="width:'+Math.round(davor/gesamt*100)+'%"></i></div>';
}

/* ---------------------- Zeichnen ---------------------- */
var app = document.getElementById("app");

function zeichne(){
  var s = SCHIRME[jetzt], innen;
  if(s.art==="auftakt")       innen = auftaktHtml();
  else if(s.art==="warten")   innen = wartenHtml();
  else if(s.art==="typ")      innen = typHtml();
  else if(s.art==="bruch")    innen = bruchHtml();
  else if(s.art==="ende")     innen = endeHtml();
  else if(s.art==="text")     innen = fortschrittHtml()+textHtml(s);
  else if(s.art==="einwurf")  innen = fortschrittHtml()+einwurfHtml(s);
  else if(s.art==="bildwahl") innen = fortschrittHtml()+bildwahlHtml(s);
  else                        innen = fortschrittHtml()+frageHtml(s);

  app.innerHTML = '<div class="blatt"><div class="karte">'+innen+'</div></div>';
  window.scrollTo(0,0);
  verdrahte(s);
  if(s.art==="warten") setTimeout(function(){
    if(SCHIRME[jetzt].art==="warten"){ jetzt=naechster(jetzt); zeichne(); }
  }, 3000);
}

function frageHtml(s){
  var viele = s.art==="mehrfach";
  var gewaehlt = viele ? (antworten[s.id]||[]) : null;
  var h = '<h2>'+s.frage+'</h2>';
  if(s.hinweis) h += '<p class="leise">'+s.hinweis+'</p>';
  h += '<div style="margin-top:1.6rem">';
  for(var i=0;i<s.optionen.length;i++){
    var o=s.optionen[i];
    var an = viele ? (gewaehlt.indexOf(o.id)>-1?" an":"") : (antworten[s.id]===o.id?" an":"");
    h += '<button class="wahl'+an+'" data-wahl="'+o.id+'"><span class="nummer">'+(i+1)+'</span>'
       + (o.bild||"") + '<span><span class="titel">'+o.titel+'</span>'
       + (o.unter?'<span class="unter">'+o.unter+'</span>':'') + '</span>'
       + (viele?'<span class="marke"></span>':'') + '</button>';
  }
  return h + '</div>' + fussHtml(viele);
}

/* ---------------------- Zusammenfassung ---------------------- */
function beschriftung(schirmId, wertId){
  for(var i=0;i<SCHIRME.length;i++){
    var s=SCHIRME[i];
    if(s.id!==schirmId || !s.optionen) continue;
    for(var k=0;k<s.optionen.length;k++) if(s.optionen[k].id===wertId) return s.optionen[k].titel;
  }
  return wertId;
}

function zeilenListe(){
  var a=antworten, liste=[];
  var ziel = beschriftung("ziel", a.ziel);
  if(a.ziel==="skandinavien" && a.einwurf_skan==="sueden") ziel = "Südnorwegen und Schweden";
  liste.push(["Ziel", ziel]);

  var zeit = a.zeit_skan||a.zeit_sachs||a.zeit_alpen;
  if(zeit) liste.push(["Jahreszeit", beschriftung(
    a.ziel==="skandinavien"?"zeit_skan":a.ziel==="sachsen"?"zeit_sachs":"zeit_alpen", zeit)]);

  var tunId = a.ziel==="sachsen" ? "tun_sachs" : a.ziel==="alpen" ? "tun_alpen"
            : (a.zeit_skan==="winter" ? "tun_skan_winter" : "tun_skan_sommer");
  var tun = a[tunId]||[], namen=[];
  for(var i=0;i<tun.length;i++) namen.push(beschriftung(tunId, tun[i]));
  if(namen.length) liste.push(["Dabei", namen.join(" · ")]);

  if(a.wer) liste.push(["Mit", beschriftung("wer", a.wer)]);
  var schlafId = a.ziel==="skandinavien" ? "schlafen_skan" : "schlafen_sachs";
  if(a[schlafId]) liste.push(["Übernachtung", beschriftung(schlafId, a[schlafId])]);
  if(a.ziel==="alpen") liste.push(["Übernachtung", "Auf den Hütten"]);

  var dauer = a.dauer_sachs ? beschriftung("dauer_sachs", a.dauer_sachs)
            : a.dauer_lang  ? beschriftung("dauer_lang", a.dauer_lang) : null;
  if(a.einwurf_skan==="laenger") dauer = "Einmal richtig lang";
  if(dauer) liste.push(["Dauer", dauer]);
  if(a.tempo) liste.push(["Tempo", beschriftung("tempo", a.tempo)]);
  return liste;
}

function endeHtml(){
  var liste = zeilenListe(), zeilen="";
  for(var i=0;i<liste.length;i++)
    zeilen += '<div class="zeile" style="animation-delay:'+(i*0.14)+'s">'
      +'<dt>'+liste[i][0]+'</dt><dd>'+liste[i][1]+'</dd></div>';

  var feuer = FEUER[antworten.lagerfeuer]
    ? '<p class="rueckgriff">Und abends am Feuer steht '+FEUER[antworten.lagerfeuer]+' vor dir.</p>' : '';
  var wunsch = antworten.wunsch
    ? '<p class="wunschzeile">Unbedingt dabei: '+entschaerfen(antworten.wunsch)+'</p>' : '';
  var jungs = antworten.wer==="jungs"
    ? '<li>Für die Jungs organisieren wir gern mit, ihre Buchung zahlen sie selbst</li>' : '';
  var zpos = BILDAUSSCHNITT[antworten.ziel] ? ' style="object-position:'+BILDAUSSCHNITT[antworten.ziel]+'"' : '';
  var zielbild = BILDER[antworten.ziel]
    ? '<img class="endebild" src="'+BILDER[antworten.ziel]+'"'+zpos+' alt="">' : '';

  return '<div>'+zielbild+'<h2>Deine Reise</h2>'
    +'<div class="zeilen">'+zeilen+'</div>'+ feuer + wunsch
    +'<div class="nurdruck"><strong>Was wir übernehmen</strong><ul>'
    +'<li>Ein Fahrzeug, falls eins gemietet wird</li><li>Alle Übernachtungen</li><li>Die gebuchten Touren</li>'
    + jungs
    +'</ul><p class="leise" style="margin-top:.8rem">Sprit und Essen bleiben deine Sache. Gebucht wird, sobald Anett weiß, wann sie frei bekommt.</p></div></div>'
    +'<div class="fussleiste"><button class="knopf" data-drucken>Ausdrucken</button>'
    +'<button class="knopf leiseknopf" data-kopieren>Antworten kopieren</button>'
    +'<button class="knopf leiseknopf" data-neu>Von vorn</button></div>';
}

function entschaerfen(t){
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function alsText(){
  var liste=zeilenListe(), z=["Zum 65."];
  for(var i=0;i<liste.length;i++) z.push(liste[i][0]+": "+liste[i][1]);
  if(FEUER[antworten.lagerfeuer]) z.push("Am Lagerfeuer: "+FEUER[antworten.lagerfeuer]);
  if(antworten.wunsch) z.push("Unbedingt dabei: "+antworten.wunsch);
  return z.join("\n");
}

/* ---------------------- Bedienung ---------------------- */
function verdrahte(s){
  var los = app.querySelector("[data-los]"); if(los) los.onclick = weiter;
  var zur = app.querySelector("[data-zurueck]"); if(zur) zur.onclick = zurueck;

  if(s.art==="frage" || s.art==="einwurf" || s.art==="bildwahl"){
    var kn = app.querySelectorAll("[data-wahl]");
    for(var i=0;i<kn.length;i++) kn[i].onclick = function(){
      setze(s.id, this.getAttribute("data-wahl"));
      if(s.id==="einwurf_skan" && antworten.einwurf_skan==="laenger") antworten.dauer_lang="lang";
      weiter();
    };
  }
  if(s.art==="mehrfach"){
    var gewaehlt = antworten[s.id] ? antworten[s.id].slice() : [];
    var kn2 = app.querySelectorAll("[data-wahl]"), w = app.querySelector("[data-weiter]");
    for(var k=0;k<kn2.length;k++) kn2[k].onclick = function(){
      var id=this.getAttribute("data-wahl"), pos=gewaehlt.indexOf(id);
      if(pos>-1) gewaehlt.splice(pos,1); else gewaehlt.push(id);
      this.classList.toggle("an", pos===-1);
      if(w) w.disabled = gewaehlt.length===0;
    };
    if(w){ w.disabled = gewaehlt.length===0;
      w.onclick = function(){ setze(s.id, gewaehlt); weiter(); }; }
  }
  if(s.art==="text"){
    var feld = app.querySelector("#wunschfeld"), wt = app.querySelector("[data-weiter]");
    if(wt) wt.onclick = function(){ setze(s.id, feld.value.trim()); weiter(); };
  }

  var d = app.querySelector("[data-drucken]"); if(d) d.onclick = function(){ window.print(); };
  var kop = app.querySelector("[data-kopieren]");
  if(kop) kop.onclick = function(){
    var self=this, txt=alsText();
    function fertig(){ self.textContent="Kopiert"; setTimeout(function(){ self.textContent="Antworten kopieren"; },1800); }
    function ersatz(){
      var t=document.createElement("textarea"); t.value=txt;
      document.body.appendChild(t); t.select();
      try{ document.execCommand("copy"); fertig(); }catch(e){ self.textContent="Ging nicht"; }
      document.body.removeChild(t);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(fertig, ersatz);
    else ersatz();
  };
  var neu = app.querySelector("[data-neu]");
  if(neu) neu.onclick = function(){ antworten={}; verlauf=[]; jetzt=0; zeichne(); };
}

  this.textContent = gross ? "Normal" : "Beamer";
};
